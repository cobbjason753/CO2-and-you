# Calls the platform's housekeeping endpoint every 15 minutes: offline alerts, email retries,
# Monday weekly reports. Free on public repos. (Vercel's free plan only allows a daily cron.)
# Needs repository secrets APP_URL (e.g. https://app.cobsci.com) and CRON_SECRET.
name: Platform cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
