<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · CobSci</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#0f172a; --muted:#64748b; --brand:#0f766e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111a2b; --text:#e2e8f0; --muted:#94a3b8; --brand:#2dd4bf; color-scheme: dark; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:16px; padding:28px; max-width:360px; text-align:center; }
  h1 { font-size:20px; margin:12px 0 8px; } p { color:var(--muted); line-height:1.5; margin:0 0 20px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:12px 20px; font-weight:600; font-size:15px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" width="56" height="56" alt="" style="border-radius:14px">
    <h1>You're offline</h1>
    <p>CobSci needs an internet connection to show your rooms. Your sensors keep measuring and will catch up once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
